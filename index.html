<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTap X - Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .header {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
        }
        .user-name { font-size: 16px; font-weight: bold; color: #f39c12; }
        .score-container { margin: 10px 0; }
        #score { font-size: 52px; font-weight: bold; color: #f39c12; text-shadow: 0 0 20px rgba(243, 156, 18, 0.5); }
        .coin-box {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #f39c12, #d35400);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.4);
            transition: transform 0.1s ease;
            font-size: 80px;
            user-select: none;
        }
        .coin-box:active { transform: scale(0.92); }
        .btn-boost {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            padding: 14px 30px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
            width: 100%;
            max-width: 300px;
            transition: 0.2s;
        }
        .btn-boost:active { transform: scale(0.98); }
        
        /* কাস্টম প্রিমিয়াম মডাল */
        #customModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: #131f2e;
            border: 2px solid #f39c12;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <!-- হেডার ও ইউজার ইনফো -->
    <div class="header">
        <div class="user-name" id="username">স্বাগতম, গেমার! 🚀</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 3px;">CryptoTap X - Official Mini App</div>
    </div>

    <!-- মেইন গেম এরিয়া -->
    <div>
        <p style="font-size: 14px; color: #ccc; margin-bottom: 5px;">ট্যাপ করে কয়েন জমান!</p>
        <div class="score-container">
            <h2 id="score">0</h2>
        </div>

        <div class="coin-box" onclick="tapCoin()">
            🪙
        </div>
    </div>

    <!-- ফুটার বাটন -->
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <button class="btn-boost" onclick="buyBoost()">বুস্টার কিনুন (Telegram Stars)</button>
    </div>

    <!-- কাস্টম মডাল পপআপ বক্স -->
    <div id="customModal">
        <div class="modal-content">
            <h3 style="color: #f39c12; margin-top: 0; margin-bottom: 10px;">CryptoTap X</h3>
            <p id="modalText" style="font-size: 15px; margin-bottom: 20px; color: #ddd;">Telegram Stars পেমেন্ট সিস্টেম খুব শীঘ্রই আসছে!</p>
            <button onclick="closeModal()" style="background: linear-gradient(135deg, #f39c12, #e67e22); border: none; padding: 10px 25px; color: #000; font-weight: bold; border-radius: 10px; cursor: pointer;">বন্ধ করুন</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try {
            tg.expand();
        } catch(e) {}

        // সেফ ইউজার নেম ফেচ সিস্টেম (ব্রাউজারে খুললে 'গেমার' দেখাবে, টেলিগ্রামে খুললে আসল নাম দেখাবে)
        let userName = "গেমার";
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
            userName = tg.initDataUnsafe.user.first_name;
        }
        document.getElementById('username').innerText = `স্বাগতম, ${userName}! 🚀`;

        // লোকাল স্টোরেজ থেকে স্কোর লোড করা
        let score = parseInt(localStorage.getItem('taps')) || 0;
        document.getElementById('score').innerText = score;

        // ট্যাপ ফাংশন
        function tapCoin() {
            score++;
            document.getElementById('score').innerText = score;
            localStorage.setItem('taps', score);
            
            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            } catch(e) {}
        }

        // বুস্টার ক্লিক করলে প্রিমিয়াম পপআপ আসবে
        function buyBoost() {
            showCustomAlert("Telegram Stars পেমেন্ট সিস্টেম খুব শীঘ্রই আসছে!");
        }

        function showCustomAlert(message) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }
    </script>
</body>
</html>
