<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoTap X - Elite Web3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none;
            user-select: none; 
        }
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        /* Elite Header */
        .header {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 12px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .user-name { font-size: 15px; font-weight: 700; color: #fbbf24; letter-spacing: 0.5px; }
        
        /* Score Display */
        .score-container { margin: 10px 0; }
        #score { 
            font-size: 50px; 
            font-weight: 900; 
            background: linear-gradient(180deg, #ffffff 15%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
            letter-spacing: 1px;
        }

        /* Energy Section */
        .energy-wrapper {
            width: 100%;
            max-width: 320px;
            margin: 8px auto;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .energy-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            height: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        #energyBar {
            height: 100%;
            background: linear-gradient(90deg, #d97706, #fbbf24);
            width: 100%;
            border-radius: 20px;
            transition: width 0.15s ease-out;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }

        /* Ultra Professional 3D Coin */
        .coin-wrapper {
            position: relative;
            margin: 15px auto;
        }
        .coin-box {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at 35% 35%, #fde047 0%, #ca8a04 55%, #78350f 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.06s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            border: 5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 50px rgba(234, 179, 8, 0.45), 
                        inset 0 0 30px rgba(255, 255, 255, 0.7),
                        0 15px 35px rgba(0, 0, 0, 0.6);
            font-size: 80px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
        }
        .coin-box:active { 
            transform: scale(0.91); 
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Game Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 360px;
            margin-top: 10px;
        }
        .btn-feature {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn-feature:active { transform: scale(0.96); background: rgba(30, 41, 59, 0.8); }
        
        /* Full Boost Button */
        .btn-boost-full {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            border: none;
            padding: 14px;
            color: #030712;
            font-weight: 800;
            font-size: 15px;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            max-width: 360px;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
            outline: none;
            transition: transform 0.1s;
        }
        .btn-boost-full:active { transform: scale(0.97); }

        /* Professional Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.88);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: linear-gradient(145deg, #0f172a, #090d16);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 22px;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        .modal-content h3 {
            font-size: 20px;
            color: #fbbf24;
            margin-bottom: 6px;
            font-weight: 800;
        }
        .task-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 14px;
            border-radius: 14px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            text-align: left;
            font-weight: 500;
        }
        .btn-task-claim {
            background: linear-gradient(135deg, #10b981, #047857);
            border: none;
            padding: 8px 14px;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            white-space: nowrap;
        }
        .btn-task-claim:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-name" id="username">Welcome, Gamer! 🚀</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 2px; letter-spacing: 1px;">CRYPTOTAP X • ELITE</div>
    </div>

    <div>
        <div class="score-container">
            <h2 id="score">0</h2>
        </div>
        
        <div class="coin-wrapper">
            <div class="coin-box" onclick="tapCoin(event)">
                X
            </div>
        </div>

        <div class="energy-wrapper">
            <div class="energy-info">
                <span>⚡ Energy</span>
                <span id="energyText">1000/1000</span>
            </div>
            <div class="energy-box">
                <div id="energyBar"></div>
            </div>
        </div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="menu-grid">
            <button class="btn-feature" onclick="upgradeTap()">🛠️ Tap Power (+1)<br><span style="font-size:11px; color:#fbbf24;" id="upgradeCost">500 Coins</span></button>
            <button class="btn-feature" onclick="openTasks()">📋 Task Center<br><span style="font-size:11px; color:#34d399;">+3500 Rewards</span></button>
            <button class="btn-feature" onclick="claimDaily()">🎁 Daily Bonus<br><span style="font-size:11px; color:#60a5fa;">Daily 200 Coins</span></button>
            <button class="btn-feature" onclick="inviteFriend()">👥 Invite Friends<br><span style="font-size:11px; color:#f87171;">Earn Bonus</span></button>
        </div>

        <button class="btn-boost-full" onclick="buyBoost()">⭐ Buy Booster (Telegram Stars)</button>
    </div>

    <!-- Task Modal (3500 Coins Reward & Instagram Removed) -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h3>📋 Task Center</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Complete tasks and claim 3500 coins each!</p>
            
            <div class="task-item">
                <span>📢 Join Telegram Channel<br><b style="color:#fbbf24;">+3500 Coins</b></span>
                <button class="btn-task-claim" onclick="completeTask('task_tg', 3500, 'https://t.me/Cryptotapxofficial')">Start</button>
            </div>

            <div class="task-item">
                <span>📺 Subscribe YouTube<br><b style="color:#fbbf24;">+3500 Coins</b></span>
                <button class="btn-task-claim" onclick="completeTask('task_yt', 3500, 'https://www.youtube.com/@Cryptotap-X')">Start</button>
            </div>

            <div class="task-item">
                <span>🐦 Follow Twitter (X)<br><b style="color:#fbbf24;">+3500 Coins</b></span>
                <button class="btn-task-claim" onclick="completeTask('task_tw', 3500, 'https://x.com/Cryptotapx')">Start</button>
            </div>

            <div class="task-item">
                <span>👥 Follow Facebook Page<br><b style="color:#fbbf24;">+3500 Coins</b></span>
                <button class="btn-task-claim" onclick="completeTask('task_fb', 3500, 'https://facebook.com/Cryptotapx')">Start</button>
            </div>

            <button onclick="closeTasks()" style="margin-top: 15px; background: #ef4444; border:none; padding:10px 26px; color:#fff; border-radius:12px; cursor:pointer; font-weight:700; font-size:13px;">Close</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try {
            tg.expand();
            let userName = "Gamer";
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
                userName = tg.initDataUnsafe.user.first_name;
            }
            document.getElementById('username').innerText = `Welcome, ${userName}! 🚀`;
        } catch(e) {}

        let score = parseInt(localStorage.getItem('taps')) || 0;
        let tapPower = parseInt(localStorage.getItem('tapPower')) || 1;
        let upgradeCost = parseInt(localStorage.getItem('upgradeCost')) || 500;
        
        let maxEnergy = 1000;
        let energy = parseInt(localStorage.getItem('energy')) || 1000;
        let lastTime = parseInt(localStorage.getItem('lastTime')) || Date.now();

        let now = Date.now();
        let secondsPassed = Math.floor((now - lastTime) / 1000);
        
        energy = Math.min(maxEnergy, energy + (secondsPassed * 2));
        updateUI();

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energyText').innerText = `${energy}/${maxEnergy}`;
            document.getElementById('energyBar').style.width = (energy / maxEnergy) * 100 + '%';
            document.getElementById('upgradeCost').innerText = `${upgradeCost} Coins`;
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
            localStorage.setItem('energy', energy);
            localStorage.setItem('lastTime', Date.now());
            localStorage.setItem('taps', score);
        }, 1000);

        function playClickSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function tapCoin(event) {
            if (energy > 0) {
                score += tapPower;
                energy -= 1;
                updateUI();
                playClickSound();
                localStorage.setItem('taps', score);
                localStorage.setItem('energy', energy);

                try {
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                } catch(e) {}
            } else {
                alert("Energy is empty! Please wait for it to refill.");
            }
        }

        function upgradeTap() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                tapPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                localStorage.setItem('tapPower', tapPower);
                localStorage.setItem('upgradeCost', upgradeCost);
                updateUI();
                alert(`Success! Your tap power is now ${tapPower}`);
            } else {
                alert("Not enough coins!");
            }
        }

        function openTasks() {
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeTasks() {
            document.getElementById('taskModal').style.display = 'none';
        }

        function completeTask(taskId, reward, link) {
            let completed = localStorage.getItem(taskId);
            if (completed) {
                alert("You have already completed this task!");
                return;
            }
            
            window.open(link, '_blank');
            score += reward;
            localStorage.setItem(taskId, 'true');
            updateUI();
            alert(`Congratulations! You completed the task and received ${reward} bonus coins! 🎉`);
        }

        function claimDaily() {
            let lastClaim = localStorage.getItem('lastClaim') || 0;
            let today = new Date().toDateString();
            if (lastClaim === today) {
                alert("You have already claimed today's daily bonus! Try again tomorrow.");
            } else {
                score += 200;
                localStorage.setItem('lastClaim', today);
                updateUI();
                alert("Congratulations! You received 200 coins as a daily bonus! 🎁");
            }
        }

        function inviteFriend() {
            let userId = "12345";
            try {
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                    userId = tg.initDataUnsafe.user.id;
                }
            } catch(e) {}

            let inviteLink = `https://t.me/miraztap_bot/cryptotap?startapp=ref_${userId}`;
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent("🔥 Awesome game! Tap to earn crypto coins now:")}`);
            } else {
                prompt("Copy your invite link:", inviteLink);
            }
        }

        async function buyBoost() {
            try {
                let res = await fetch('/api/buy');
                let data = await res.json();

                if (data.invoiceLink) {
                    tg.openInvoice(data.invoiceLink, (status) => {
                        if (status === 'paid') {
                            score += 500;
                            updateUI();
                            alert("Payment successful and 500 bonus coins added!");
                        } else {
                            alert("Payment not completed.");
                        }
                    });
                } else {
                    alert("Error: " + (data.error || "Could not generate payment link"));
                }
            } catch (e) {
                alert("Server connection failed!");
            }
        }
    </script>
</body>
</html>
