<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTap X</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        .coin {
            font-size: 80px;
            cursor: pointer;
            margin: 40px 0;
            transition: transform 0.1s;
        }
        .coin:active {
            transform: scale(0.9);
        }
        button {
            background: #f3ba2f;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            color: #000;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🪙 CryptoTap X</h1>
    <p>ট্যাপ করে কয়েন জমান!</p>
    <h2 id="score">0</h2>
    
    <div class="coin" onclick="tapCoin()">🪙</div>
    
    <br>
    <button onclick="buyBoost()">বূস্টার কিনুন (Telegram Stars)</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = localStorage.getItem('taps') || 0;
        document.getElementById('score').innerText = score;

        function tapCoin() {
            score++;
            document.getElementById('score').innerText = score;
            localStorage.setItem('taps', score);
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function buyBoost() {
            tg.showAlert("Telegram Stars পেমেন্ট সিস্টেম এখানে যুক্ত হবে!");
        }
    </script>
</body> <!-- প্রিমিয়াম কাস্টম মডাল পপআপ -->
<div id="customModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:9999;">
    <div style="background:#131f2e; border: 2px solid #f39c12; padding: 25px; border-radius: 20px; text-align: center; width: 85%; max-width: 320px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.7);">
        <h3 style="color: #f39c12; margin-top: 0; margin-bottom: 10px; font-family: sans-serif;">CryptoTap X</h3>
        <p id="modalText" style="font-size: 15px; margin-bottom: 20px; color: #ddd; font-family: sans-serif;">Telegram Stars পেমেন্ট সিস্টেম এখানে যুক্ত হবে!</p>
        <button onclick="closeModal()" style="background: linear-gradient(135deg, #f39c12, #e67e22); border: none; padding: 10px 25px; color: #000; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 14px;">বন্ধ করুন</button>
    </div>
</div>

<script>
// পপআপ ওপেন করার ফাংশন
function showCustomAlert(message) {
    document.getElementById('modalText').innerText = message;
    document.getElementById('customModal').style.display = 'flex';
}

// পপআপ ক্লোজ করার ফাংশন
function closeModal() {
    document.getElementById('customModal').style.display = 'none';
}
</script>

</html>
