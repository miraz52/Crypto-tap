<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoTap X - Elite Web3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDK (Version 8 compat for single file ease) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center; padding: 12px; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        /* Loading & Ban Screen Overlay */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #030712; z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .loader {
            border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid #fbbf24;
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* UI Styles */
        .header {
            width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15); padding: 12px 18px; border-radius: 16px;
        }
        .user-name { font-size: 15px; font-weight: 700; color: #fbbf24; }
        .score-container { margin: 10px 0; }
        #score { font-size: 50px; font-weight: 900; background: linear-gradient(180deg, #ffffff 15%, #fbbf24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .energy-wrapper { width: 100%; max-width: 320px; margin: 8px auto; }
        .energy-info { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 4px;}
        .energy-box { width: 100%; background: rgba(255, 255, 255, 0.06); border-radius: 20px; height: 12px; }
        #energyBar { height: 100%; background: linear-gradient(90deg, #d97706, #fbbf24); border-radius: 20px; transition: 0.15s; }

        .coin-wrapper { position: relative; margin: 15px auto; }
        .coin-box {
            width: 180px; height: 180px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at 35% 35%, #fde047 0%, #ca8a04 55%, #78350f 100%);
            border: 5px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 50px rgba(234, 179, 8, 0.45);
            font-size: 80px; font-weight: 900; color: #ffffff; cursor: pointer; transition: 0.06s;
        }
        .coin-box:active { transform: scale(0.91); }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 360px; margin-top: 10px; }
        .btn-feature { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; color: #fff; border-radius: 14px; font-size: 12px; font-weight: bold; cursor: pointer;}
        .btn-boost-full { background: linear-gradient(135deg, #f59e0b, #b45309); width: 100%; max-width: 360px; padding: 14px; border-radius: 14px; border: none; font-weight: bold; margin-top: 8px; cursor: pointer;}
    </style>
</head>
<body>

    <!-- Loading & Anti-Cheat Screen -->
    <div id="overlay">
        <div class="loader" id="loader"></div>
        <h2 id="statusText" style="margin-top: 20px; font-size: 16px; color: #fbbf24;">Checking Security...</h2>
    </div>

    <!-- Main Game UI -->
    <div id="gameUI" style="display: none; width: 100%; align-items: center; flex-direction: column;">
        <div class="header">
            <div class="user-name" id="username">Welcome, Gamer! 🚀</div>
            <div style="font-size: 11px; color: #64748b; margin-top: 2px;">CRYPTOTAP X • ELITE</div>
        </div>

        <div>
            <div class="score-container"><h2 id="score">0</h2></div>
            <div class="coin-wrapper"><div class="coin-box" onclick="tapCoin()">X</div></div>
            <div class="energy-wrapper">
                <div class="energy-info"><span>⚡ Energy</span><span id="energyText">1000/1000</span></div>
                <div class="energy-box"><div id="energyBar"></div></div>
            </div>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="menu-grid">
                <button class="btn-feature" onclick="upgradeTap()">🛠️ Tap Power (+1)<br><span style="color:#fbbf24;" id="upgradeCost">500 Coins</span></button>
                <button class="btn-feature" onclick="claimDaily()">🎁 Daily Bonus<br><span style="color:#60a5fa;">Daily 200 Coins</span></button>
            </div>
            <button class="btn-boost-full">⭐ Buy Booster (Coming Soon)</button>
        </div>
    </div>

    <script>
        // ====================================================================
        // আপনার FIREBASE CONFIG কোড এখানে পেস্ট করুন (Project Settings থেকে পাবেন)
        // ====================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // ====================================================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let tg = window.Telegram.WebApp;
        let userId = "guest";
        let userName = "Gamer";
        
        try {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = String(tg.initDataUnsafe.user.id);
                userName = tg.initDataUnsafe.user.first_name;
            }
        } catch(e) {}

        // গেম ভ্যারিয়েবল
        let score = 0;
        let tapPower = 1;
        let upgradeCost = 500;
        let maxEnergy = 1000;
        let energy = 1000;
        let lastTime = Date.now();
        let isBanned = false;

        // Anti-Cheat & Login System
        async function authenticateUser() {
            if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                document.getElementById('statusText').innerText = "Developer: Setup Firebase Config First!";
                return;
            }

            try {
                document.getElementById('statusText').innerText = "Fetching IP Address...";
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipRes.json();
                let userIp = ipData.ip;

                document.getElementById('statusText').innerText = "Verifying Account...";
                
                // IP Address Database Check
                const usersRef = db.collection('users');
                const ipCheck = await usersRef.where('ip', '==', userIp).get();
                
                let isMultiAccount = false;
                ipCheck.forEach(doc => {
                    if (doc.id !== userId) isMultiAccount = true;
                });

                if (isMultiAccount) {
                    showBanScreen("⛔ Account Banned!<br>Multiple accounts detected on this device/IP.");
                    return;
                }

                // Load or Create User Data
                const userDoc = await usersRef.doc(userId).get();
                if (userDoc.exists) {
                    let data = userDoc.data();
                    if (data.banned) {
                        showBanScreen("⛔ Account Suspended by Admin.");
                        return;
                    }
                    score = data.score || 0;
                    tapPower = data.tapPower || 1;
                    upgradeCost = data.upgradeCost || 500;
                    energy = data.energy || 1000;
                    lastTime = data.lastTime || Date.now();
                } else {
                    // New User Registration
                    await usersRef.doc(userId).set({
                        telegramId: userId,
                        name: userName,
                        ip: userIp,
                        score: 0,
                        tapPower: 1,
                        upgradeCost: 500,
                        energy: 1000,
                        lastTime: Date.now(),
                        banned: false
                    });
                }

                // Calculate Offline Energy
                let secondsPassed = Math.floor((Date.now() - lastTime) / 1000);
                energy = Math.min(maxEnergy, energy + (secondsPassed * 2));

                startGame();

            } catch (error) {
                document.getElementById('statusText').innerText = "Network Error! Please restart the game.";
                console.error(error);
            }
        }

        function showBanScreen(msg) {
            isBanned = true;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('statusText').innerHTML = msg;
            document.getElementById('statusText').style.color = '#ef4444';
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gameUI').style.display = 'flex';
            document.getElementById('username').innerText = `Welcome, ${userName}! 🚀`;
            updateUI();
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energyText').innerText = `${energy}/${maxEnergy}`;
            document.getElementById('energyBar').style.width = (energy / maxEnergy) * 100 + '%';
            document.getElementById('upgradeCost').innerText = `${upgradeCost} Coins`;
        }

        // Energy Recovery Loop
        setInterval(() => {
            if (!isBanned && energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
        }, 1000);

        // Save Data to Cloud every 5 seconds (To save Firebase Quota)
        setInterval(() => {
            if (!isBanned && score > 0) {
                db.collection('users').doc(userId).update({
                    score: score,
                    energy: energy,
                    tapPower: tapPower,
                    upgradeCost: upgradeCost,
                    lastTime: Date.now()
                });
            }
        }, 5000);

        function tapCoin() {
            if (isBanned) return;
            if (energy >= tapPower) {
                score += tapPower;
                energy -= tapPower;
                updateUI();
                
                try {
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                } catch(e) {}
            }
        }

        function upgradeTap() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                tapPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                updateUI();
                alert(`Success! Your tap power is now ${tapPower}`);
            } else {
                alert("Not enough coins!");
            }
        }

        // Start Process
        window.onload = () => {
            authenticateUser();
        };

    </script>
</body>
</html>
