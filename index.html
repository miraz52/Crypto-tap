<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTap X - Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none;
            user-select: none; 
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        .header {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 15px;
        }
        .user-name { font-size: 15px; font-weight: bold; color: #f39c12; }
        .score-container { margin: 5px 0; }
        #score { font-size: 45px; font-weight: bold; color: #f39c12; text-shadow: 0 0 20px rgba(243, 156, 18, 0.5); }
        
        .energy-box {
            width: 100%;
            max-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            height: 14px;
            margin: 8px auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #energyBar {
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #e67e22);
            width: 100%;
            transition: width 0.2s;
        }

        .coin-box {
            width: 170px;
            height: 170px;
            background: transparent;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            cursor: pointer;
            transition: transform 0.08s ease;
            outline: none;
            border: none;
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.3);
        }
        .coin-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }
        .coin-box:active { transform: scale(0.92); }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
        }
        .btn-feature {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            outline: none;
        }
        .btn-feature:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }
        
        .btn-boost-full {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            padding: 12px;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            margin-top: 8px;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
            outline: none;
        }
        .btn-boost-full:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-name" id="username">স্বাগতম, গেমার! 🚀</div>
        <div style="font-size: 11px; color: #aaa;">CryptoTap X - Pro</div>
    </div>

    <div>
        <div class="score-container">
            <h2 id="score">0</h2>
        </div>
        
        <!-- এখানে আপনার ছবির আসল ফাইলের নাম বসানো হয়েছে -->
        <div class="coin-box" onclick="tapCoin(event)">
            <img src="183263530_1786007231822439.jpg" alt="Crypto Coin">
        </div>

        <div style="font-size: 12px; color: #ccc; margin-top: 5px;">
            ⚡ এনার্জি: <span id="energyText">1000/1000</span>
        </div>
        <div class="energy-box">
            <div id="energyBar"></div>
        </div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="menu-grid">
            <button class="btn-feature" onclick="upgradeTap()">🛠️ পাওয়ার আপ (+১)<br><span style="font-size:10px; color:#f39c12;" id="upgradeCost">৫০০ কয়েন</span></button>
            <button class="btn-feature" onclick="claimDaily()">🎁 ডেইলি বোনাস<br><span style="font-size:10px; color:#2ecc71;">প্রতিদিন ২০০ কয়েন</span></button>
            <button class="btn-feature" onclick="claimPassive()">💰 মাইনিং কালেক্ট<br><span style="font-size:10px; color:#3498db;">অটো আর্নিং</span></button>
            <button class="btn-feature" onclick="inviteFriend()">👥 ইনভাইট ফ্রেন্ড<br><span style="font-size:10px; color:#e74c3c;">বোনাস পান</span></button>
        </div>

        <button class="btn-boost-full" onclick="buyBoost()">⭐ বুস্টার কিনুন (Telegram Stars)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try {
            tg.expand();
            let userName = "গেমার";
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
                userName = tg.initDataUnsafe.user.first_name;
            }
            document.getElementById('username').innerText = `স্বাগতম, ${userName}! 🚀`;
        } catch(e) {}

        let score = parseInt(localStorage.getItem('taps')) || 0;
        let tapPower = parseInt(localStorage.getItem('tapPower')) || 1;
        let upgradeCost = parseInt(localStorage.getItem('upgradeCost')) || 500;
        
        let maxEnergy = 1000;
        let energy = parseInt(localStorage.getItem('energy')) || 1000;
        let lastTime = parseInt(localStorage.getItem('lastTime')) || Date.now();

        let now = Date.now();
        let secondsPassed = Math.floor((now - lastTime) / 1000);
        
        energy = Math.min(maxEnergy, energy + (secondsPassed * 2));
        
        let offlineCoins = Math.floor((secondsPassed / 3600) * 10);
        if (offlineCoins > 0) {
            score += offlineCoins;
            alert(`অভিনন্দন! আপনি অফলাইনে থাকাকালীন মাইনিং থেকে ${offlineCoins} কয়েন পেয়েছেন! 🎉`);
        }

        updateUI();

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energyText').innerText = `${energy}/${maxEnergy}`;
            document.getElementById('energyBar').style.width = (energy / maxEnergy) * 100 + '%';
            document.getElementById('upgradeCost').innerText = `${upgradeCost} কয়েন`;
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
            localStorage.setItem('energy', energy);
            localStorage.setItem('lastTime', Date.now());
            localStorage.setItem('taps', score);
        }, 1000);

        function playClickSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function tapCoin(event) {
            if (energy > 0) {
                score += tapPower;
                energy -= 1;
                updateUI();
                playClickSound();
                localStorage.setItem('taps', score);
                localStorage.setItem('energy', energy);

                try {
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                } catch(e) {}
            } else {
                alert("আপনার এনার্জি শেষ! কিছুক্ষণ অপেক্ষা করুন রিফিল হওয়ার জন্য।");
            }
        }

        function upgradeTap() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                tapPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                localStorage.setItem('tapPower', tapPower);
                localStorage.setItem('upgradeCost', upgradeCost);
                updateUI();
                alert(`সফল! আপনার প্রতি ট্যাপ পাওয়ার এখন ${tapPower}`);
            } else {
                alert("পর্যাপ্ত কয়েন নেই!");
            }
        }

        function claimDaily() {
            let lastClaim = localStorage.getItem('lastClaim') || 0;
            let today = new Date().toDateString();
            if (lastClaim === today) {
                alert("আজকের ডেইলি বোনাস আপনি ইতিমধ্যে নিয়ে নিয়েছেন! কাল আবার চেষ্টা করুন।");
            } else {
                score += 200;
                localStorage.setItem('lastClaim', today);
                updateUI();
                alert("অভিনন্দন! আপনি ডেইলি বোনাস হিসেবে ২০০ কয়েন পেয়েছেন! 🎁");
            }
        }

        function claimPassive() {
            alert("আপনার মাইনিং ব্যাকগ্রাউন্ডে অটোমেটিক চালু আছে এবং পয়েন্ট স্কোর এর সাথে যোগ হয়ে গেছে!");
        }

        function inviteFriend() {
            let userId = "12345";
            try {
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                    userId = tg.initDataUnsafe.user.id;
                }
            } catch(e) {}

            let inviteLink = `https://t.me/miraztap_bot/cryptotap?startapp=ref_${userId}`;
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent("🔥 দারুণ একটি গেম! সরাসরি ট্যাপ করে কয়েন ইনকাম করুন:")}`);
            } else {
                prompt("আপনার ইনভাইট লিংক কপি করুন:", inviteLink);
            }
        }

        async function buyBoost() {
            try {
                let res = await fetch('/api/buy');
                let data = await res.json();

                if (data.invoiceLink) {
                    tg.openInvoice(data.invoiceLink, (status) => {
                        if (status === 'paid') {
                            score += 500;
                            updateUI();
                            alert("অভিনন্দন! পেমেন্ট সফল হয়েছে এবং ৫০০ কয়েন বোনাস যুক্ত হয়েছে!");
                        } else {
                            alert("পেমেন্ট সম্পন্ন হয়নি।");
                        }
                    });
                } else {
                    alert("এরর: " + (data.error || "পেমেন্ট লিংক তৈরি করা যায়নি"));
                }
            } catch (e) {
                alert("সার্ভার কানেকশন ফেইলড!");
            }
        }
    </script>
</body>
</html>
