<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoTap X - Elite Web3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center; padding: 12px; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        .header {
            width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15); padding: 12px 18px; border-radius: 16px;
        }
        .user-name { font-size: 15px; font-weight: 700; color: #fbbf24; }
        .score-container { margin: 10px 0; }
        #score { font-size: 50px; font-weight: 900; background: linear-gradient(180deg, #ffffff 15%, #fbbf24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .energy-wrapper { width: 100%; max-width: 320px; margin: 8px auto; }
        .energy-info { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 4px;}
        .energy-box { width: 100%; background: rgba(255, 255, 255, 0.06); border-radius: 20px; height: 12px; }
        #energyBar { height: 100%; background: linear-gradient(90deg, #d97706, #fbbf24); border-radius: 20px; transition: 0.15s; }

        .coin-wrapper { position: relative; margin: 15px auto; }
        .coin-box {
            width: 180px; height: 180px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at 35% 35%, #fde047 0%, #ca8a04 55%, #78350f 100%);
            border: 5px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 50px rgba(234, 179, 8, 0.45);
            font-size: 80px; font-weight: 900; color: #ffffff; cursor: pointer; transition: 0.06s;
        }
        .coin-box:active { transform: scale(0.91); }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 360px; margin-top: 10px; }
        .btn-feature { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; color: #fff; border-radius: 14px; font-size: 12px; font-weight: bold; cursor: pointer;}
        .btn-boost-full { background: linear-gradient(135deg, #f59e0b, #b45309); width: 100%; max-width: 360px; padding: 14px; border-radius: 14px; border: none; font-weight: bold; margin-top: 8px; cursor: pointer;}
    </style>
</head>
<body>

    <div class="header">
        <div class="user-name" id="username">Welcome, Gamer! 🚀</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 2px;">CRYPTOTAP X • ELITE</div>
    </div>

    <div>
        <div class="score-container"><h2 id="score">0</h2></div>
        <div class="coin-wrapper"><div class="coin-box" onclick="tapCoin()">X</div></div>
        <div class="energy-wrapper">
            <div class="energy-info"><span>⚡ Energy</span><span id="energyText">1000/1000</span></div>
            <div class="energy-box"><div id="energyBar"></div></div>
        </div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="menu-grid">
            <button class="btn-feature" onclick="upgradeTap()">🛠️ Tap Power (+1)<br><span style="color:#fbbf24;" id="upgradeCost">500 Coins</span></button>
            <button class="btn-feature" onclick="claimDaily()">🎁 Daily Bonus<br><span style="color:#60a5fa;">Daily 200 Coins</span></button>
        </div>
        <button class="btn-boost-full">⭐ Buy Booster (Coming Soon)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let userId = "guest";
        let userName = "Gamer";
        
        try {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = String(tg.initDataUnsafe.user.id);
                userName = tg.initDataUnsafe.user.first_name || "Gamer";
            }
        } catch(e) {}

        document.getElementById('username').innerText = `Welcome, ${userName}! 🚀`;

        // Unique User Storage Keys (এক ডিভাইসে আলাদা অ্যাকাউন্ট আলাদা রাখবে)
        const scoreKey = 'taps_' + userId;
        const powerKey = 'tapPower_' + userId;
        const costKey = 'upgradeCost_' + userId;
        const energyKey = 'energy_' + userId;
        const timeKey = 'lastTime_' + userId;
        const claimKey = 'lastClaim_' + userId;

        let score = parseInt(localStorage.getItem(scoreKey)) || 0;
        let tapPower = parseInt(localStorage.getItem(powerKey)) || 1;
        let upgradeCost = parseInt(localStorage.getItem(costKey)) || 500;
        let maxEnergy = 1000;
        let energy = parseInt(localStorage.getItem(energyKey)) || 1000;
        let lastTime = parseInt(localStorage.getItem(timeKey)) || Date.now();

        // Offline Energy Calculation
        let secondsPassed = Math.floor((Date.now() - lastTime) / 1000);
        energy = Math.min(maxEnergy, energy + (secondsPassed * 2));
        updateUI();

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energyText').innerText = `${energy}/${maxEnergy}`;
            document.getElementById('energyBar').style.width = (energy / maxEnergy) * 100 + '%';
            document.getElementById('upgradeCost').innerText = `${upgradeCost} Coins`;
        }

        // Energy Recovery & Auto-save Loop
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
            localStorage.setItem(energyKey, energy);
            localStorage.setItem(timeKey, Date.now());
            localStorage.setItem(scoreKey, score);
        }, 1000);

        function tapCoin() {
            if (energy > 0) {
                score += tapPower;
                energy -= 1;
                updateUI();
                localStorage.setItem(scoreKey, score);
                localStorage.setItem(energyKey, energy);
                
                try {
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                } catch(e) {}
            }
        }

        function upgradeTap() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                tapPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                localStorage.setItem(powerKey, tapPower);
                localStorage.setItem(costKey, upgradeCost);
                localStorage.setItem(scoreKey, score);
                updateUI();
                alert(`Success! Your tap power is now ${tapPower}`);
            } else {
                alert("Not enough coins!");
            }
        }

        function claimDaily() {
            let lastClaimDate = localStorage.getItem(claimKey) || 0;
            let today = new Date().toDateString();
            if (lastClaimDate === today) {
                alert("You have already claimed today's daily bonus! Try again tomorrow.");
            } else {
                score += 200;
                localStorage.setItem(claimKey, today);
                localStorage.setItem(scoreKey, score);
                updateUI();
                alert("Congratulations! You received 200 coins as a daily bonus! 🎁");
            }
        }
    </script>
</body>
</html>
