<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoTap X - Elite Web3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); color: #ffffff; font-family: 'Inter', system-ui, sans-serif; text-align: center; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
        .header { width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 215, 0, 0.15); padding: 12px 18px; border-radius: 16px; }
        .user-name { font-size: 15px; font-weight: 700; color: #fbbf24; }
        #score { font-size: 50px; font-weight: 900; background: linear-gradient(180deg, #ffffff 15%, #fbbf24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .coin-box { width: 180px; height: 180px; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at 35% 35%, #fde047 0%, #ca8a04 55%, #78350f 100%); border: 5px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 50px rgba(234, 179, 8, 0.45); font-size: 80px; font-weight: 900; color: #ffffff; cursor: pointer; transition: 0.06s; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 360px; margin-top: 10px; }
        .btn-feature { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; color: #fff; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer;}
        .btn-boost-full { background: linear-gradient(135deg, #f59e0b, #b45309); width: 100%; max-width: 360px; padding: 14px; border-radius: 14px; border: none; font-weight: bold; margin-top: 8px; cursor: pointer;}
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.88); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: linear-gradient(145deg, #0f172a, #090d16); border: 1px solid rgba(255, 215, 0, 0.2); padding: 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
        .task-item { background: rgba(255, 255, 255, 0.04); padding: 10px; border-radius: 10px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .btn-task-claim { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; padding: 6px 12px; color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header"><div class="user-name" id="username">Welcome, Gamer! 🚀</div></div>
    <div>
        <div class="score-container"><h2 id="score">0</h2></div>
        <div class="coin-box" onclick="tapCoin()">X</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 10px;">⚡ Energy <span id="energyText">1000/1000</span></div>
    </div>

    <div class="menu-grid">
        <button class="btn-feature" onclick="upgradeTap()">🛠️ Tap Power<br><span id="upgradeCost">500 Coins</span></button>
        <button class="btn-feature" onclick="openTasks()">📋 Task Center<br>3500 Rewards</button>
        <button class="btn-feature" onclick="claimDaily()">🎁 Daily Bonus<br>200 Coins</button>
        <button class="btn-feature" onclick="inviteFriend()">👥 Invite<br>Earn Bonus</button>
    </div>
    <button class="btn-boost-full" onclick="buyBoost()">⭐ Buy Booster (Telegram Stars)</button>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h3>📋 Task Center</h3>
            <div class="task-item"><span>📢 Telegram Channel</span><button class="btn-task-claim" id="task_tg_btn" onclick="handleTask('task_tg', 3500, 'https://t.me/Cryptotapxofficial')">Start</button></div>
            <div class="task-item"><span>📺 YouTube</span><button class="btn-task-claim" id="task_yt_btn" onclick="handleTask('task_yt', 3500, 'https://www.youtube.com/@Cryptotap-X')">Start</button></div>
            <button onclick="closeTasks()" style="background:#ef4444; border:none; padding:8px 20px; color:#fff; border-radius:8px; margin-top:10px;">Close</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let userId = "guest";
        try { tg.expand(); if(tg.initDataUnsafe && tg.initDataUnsafe.user) userId = String(tg.initDataUnsafe.user.id); } catch(e) {}

        const sKey = 's_' + userId, pKey = 'p_' + userId, cKey = 'c_' + userId, eKey = 'e_' + userId, tKey = 't_' + userId;
        let score = parseInt(localStorage.getItem(sKey)) || 0, tapPower = parseInt(localStorage.getItem(pKey)) || 1, upgradeCost = parseInt(localStorage.getItem(cKey)) || 500, energy = parseInt(localStorage.getItem(eKey)) || 1000;

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energyText').innerText = energy + "/1000";
            document.getElementById('upgradeCost').innerText = upgradeCost + " Coins";
        }

        function tapCoin() {
            if(energy > 0) { score += tapPower; energy--; updateUI(); localStorage.setItem(sKey, score); localStorage.setItem(eKey, energy); }
        }

        function upgradeTap() {
            if(score >= upgradeCost) { score -= upgradeCost; tapPower++; upgradeCost = Math.floor(upgradeCost * 1.5); updateUI(); localStorage.setItem(sKey, score); localStorage.setItem(pKey, tapPower); localStorage.setItem(cKey, upgradeCost); }
            else alert("Not enough coins!");
        }

        function handleTask(tid, reward, link) {
            let status = localStorage.getItem(tid + '_' + userId);
            if(status === 'completed') return alert("Done!");
            if(!status) { localStorage.setItem(tid + '_' + userId, 'visited'); window.open(link, '_blank'); document.getElementById(tid + '_btn').innerText = 'Claim'; }
            else { score += reward; localStorage.setItem(tid + '_' + userId, 'completed'); localStorage.setItem(sKey, score); updateUI(); alert("Reward added!"); }
        }

        function openTasks() { document.getElementById('taskModal').style.display = 'flex'; }
        function closeTasks() { document.getElementById('taskModal').style.display = 'none'; }
        function claimDaily() { score += 200; updateUI(); localStorage.setItem(sKey, score); alert("200 Bonus!"); }
        function inviteFriend() { alert("Share your ref link: https://t.me/miraztap_bot?startapp=ref_" + userId); }
        updateUI();
    </script>
</body>
</html>
